server {
    listen 80;
    server_name bunker-works.com;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # Fix: 'listen ... http2' is deprecated. Use the directive instead.
    http2 on; 

    server_name bunker-works.com;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Docker/Podman internal DNS resolver (Required when using variables in proxy_pass)
    resolver 127.0.0.11 valid=30s;

    # Increase max upload size for RAG document uploads in Open WebUI
    client_max_body_size 100M;

    # Reverse proxy for Open WebUI
    location / {
        # Using a variable prevents Nginx from crashing if the container is still starting
        set $webui_upstream open-webui;
        proxy_pass http://$webui_upstream:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets and Streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Disable buffering for real-time LLM token streaming
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Reverse proxy for vLLM server API
    location /vllm-api/ {
        set $vllm_upstream vllm-server;
        proxy_pass http://$vllm_upstream:8000/; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # vLLM specific streaming optimizations
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
